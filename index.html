<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Server Page</title>
    <style>
      :root {
        color-scheme: light dark;
      }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: radial-gradient(circle at top, #1d4ed8, #020617 70%);
        color: #f8fafc;
        min-height: 100vh;
        display: grid;
        place-items: center;
        overflow: hidden;
      }

      .card {
        background: rgba(15, 23, 42, 0.78);
        padding: 2.5rem 3rem;
        border-radius: 24px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
        text-align: center;
        max-width: 680px;
        border: 1px solid rgba(255,255,255,0.12);
        backdrop-filter: blur(10px);
      }

      .title {
        font-size: clamp(2.5rem, 6vw, 4rem);
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        margin: 0 0 1rem;
        color: #fff;
        text-shadow: 0 4px 0 #0f172a, 0 10px 20px rgba(0,0,0,0.35);
        transform: perspective(600px) rotateX(20deg) rotateY(-10deg);
        animation: float 2.2s ease-in-out infinite alternate;
      }

      .subtitle {
        font-size: 1rem;
        line-height: 1.7;
        color: #cbd5e1;
        margin: 0;
      }

      .orb {
        width: 90px;
        height: 90px;
        margin: 0 auto 1.2rem;
        border-radius: 50%;
        background: linear-gradient(135deg, #38bdf8, #6366f1, #ec4899);
        box-shadow: 0 0 30px rgba(56, 189, 248, 0.6);
        animation: pulse 1.4s ease-in-out infinite alternate;
      }

      @keyframes float {
        from {
          transform: perspective(600px) rotateX(20deg) rotateY(-10deg) translateY(0);
        }
        to {
          transform: perspective(600px) rotateX(20deg) rotateY(-10deg) translateY(-10px);
        }
      }

      @keyframes pulse {
        from {
          transform: scale(0.95);
          opacity: 0.8;
        }
        to {
          transform: scale(1.08);
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="orb"></div>
      <h1 class="title">Coming Soon</h1>
      <p class="subtitle">This page is now styled with a simple 3D animated effect and the requested message.</p>
    </main>
  </body>
</html>
