name: CI CD Practice

on:
  push:
    branches:
      - main

jobs:
  deploy:

    runs-on: ubuntu-latest
   

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{secrets.SSH_HOST}}
          username: ubuntu
          key: ${{secrets.SSH_PRIVATE_KEY}}

          script: |
            cd /home/ubuntu/CICD
            git pull
            npm ci
              pm2 restart cicd